<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIS Dashboard - Westminster, CA</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* Basic styling */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: 'Roboto', sans-serif;
        }

        /* Navigation bar styling */
        nav {
            background-color: #333;
            padding: 15px;
            display: flex;
            justify-content: space-between;
        }

        nav a {
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            font-weight: 500;
            border: 1px solid #ffffff;
            border-radius: 5px;
            transition: background-color 0.3s;
            background-color: transparent;
        }

        nav a:hover {
            background-color: #575757;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        #map-container {
            flex-grow: 1;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <!-- Navigation Bar -->
    <nav>
        <a href="https://mrmapllc.github.io/BackBayHomePage/" class="tools-btn">Home</a>
        <a href="https://mrmapgroup.com/contact-us" target="_blank" class="tools-btn">Support</a>
    </nav>

    <!-- Main Container -->
    <div class="container">
        <!-- Dashboard iFrame -->
        <div id="map-container">
            <iframe src="https://mrmap.maps.arcgis.com/apps/dashboards/bad867585b9a4b94b41922fcd75fde20" 
                    width="100%" height="100%" frameborder="0" allowfullscreen>
            </iframe>
        </div>
    </div>
</body>
</html>
